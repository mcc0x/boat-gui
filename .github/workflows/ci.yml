name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check toolchain
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Run offline regression checks
        run: make test
      - name: Build and verify the app bundle
        run: |
          ./build.sh --build-only
          codesign --verify --strict "build/Boat Deck.app"
          plutil -lint "build/Boat Deck.app/Contents/Info.plist"
